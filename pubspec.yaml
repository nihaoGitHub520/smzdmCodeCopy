name: smzdm_number_app
description: 多多福袋助手 - 自动抓取什么值得买最新爆料、提取9位福袋码并一键跳拼多多搜索
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0          # 网络请求，抓取发现页 / 详情页
  html: ^0.15.4         # 解析 HTML，提取爆料与评论
  shared_preferences: ^2.2.0  # 本地保存链接
  url_launcher: ^6.2.6        # 打开拼多多深链 pinduoduo://

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
