name: Build Android APK

# 触发条件：推送到 main 分支，或手动在 Actions 页面点 Run workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Android 构建需要 JDK)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 本机无法预生成 android/ 工程（含 gradle wrapper 等二进制），
      # 因此由 CI 用 flutter create 重建安卓工程，
      # 再还原我们自己带依赖的 pubspec.yaml
      - name: Backup pubspec
        run: cp pubspec.yaml /tmp/pubspec.yaml

      - name: Recreate Flutter Android project
        run: flutter create --platforms=android .

      - name: Restore our pubspec
        run: cp /tmp/pubspec.yaml pubspec.yaml

      # 注入：
      #  1) INTERNET 权限
      #  2) 桌面图标/应用名改为「多多福袋助手」
      #  3) <queries> 声明 pinduoduo 深链（Android 11+ 才能解析/打开）
      - name: Patch AndroidManifest (权限 / 应用名 / 拼多多深链)
        run: |
          python3 - <<'PY'
          import re, pathlib

          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = mf.read_text(encoding='utf-8')

          # --- 1) 联网权限（抓网页必需） ---
          if 'android.permission.INTERNET' not in s:
              s = s.replace('</manifest>',
                            '    <uses-permission android:name="android.permission.INTERNET"/>\n</manifest>')

          # --- 2) 应用显示名（桌面图标下面的名字） ---
          s = re.sub(r'android:label="[^"]*"', 'android:label="多多福袋助手"', s, count=1)

          # --- 3) queries：允许解析并打开 pinduoduo:// 深链 ---
          #   Flutter 模板自带一个 <queries>（PROCESS_TEXT），优先插到它里面，
          #   不能重复创建 <queries> 标签。
          pdd_query = (
              '        <intent>\n'
              '            <action android:name="android.intent.action.VIEW"/>\n'
              '            <data android:scheme="pinduoduo"/>\n'
              '        </intent>\n'
              '        <intent>\n'
              '            <action android:name="android.intent.action.VIEW"/>\n'
              '            <data android:scheme="https"/>\n'
              '        </intent>\n'
          )
          if 'android:scheme="pinduoduo"' not in s:
              if '</queries>' in s:
                  s = s.replace('</queries>', pdd_query + '    </queries>', 1)
              else:
                  s = s.replace('</manifest>',
                                '    <queries>\n' + pdd_query + '    </queries>\n</manifest>')

          # 校验补丁后的 manifest 是合法 XML（避免 gradle manifest 解析失败）
          import xml.dom.minidom
          xml.dom.minidom.parseString(s.encode('utf-8'))
          print('=== manifest XML 校验通过 ===')

          mf.write_text(s, encoding='utf-8')
          print('=== patched AndroidManifest.xml ===')
          print(s)
          PY

      - name: Install dependencies
        run: flutter pub get

      # 只输出静态分析结果（不阻断构建），便于失败时快速定位
      - name: Analyze
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release

      # 读出版本号，并把 APK 改成带版本号的文件名，方便 Release 里区分
      - name: Prepare APK for release
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "APP_VER=$VER" >> "$GITHUB_ENV"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "duoduo-fudai-v${VER}-build${{ github.run_number }}.apk"
          ls -la duoduo-fudai-*.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: duoduo-fudai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      # 每次构建成功都发布到 Release（tag 唯一，历史版本都会保留）
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 多多福袋助手 v${{ env.APP_VER }} (build ${{ github.run_number }})
          body: |
            自动构建产物 · 多多福袋助手 v${{ env.APP_VER }}

            - 提交：${{ github.sha }}
            - 分支：${{ github.ref_name }}
            - 构建序号：#${{ github.run_number }}

            直接下载下方 `duoduo-fudai-*.apk` 安装即可（安卓需允许「未知来源」安装）。
          files: duoduo-fudai-*.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
