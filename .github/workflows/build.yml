name: Build Android APK

# 触发条件：推送到 main 分支，或手动在 Actions 页面点 Run workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Android 构建需要 JDK)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 本机无法预生成 android/ 工程（含 gradle wrapper 等二进制），
      # 因此由 CI 用 flutter create 重建安卓工程，
      # 再还原我们自己带依赖的 pubspec.yaml
      - name: Backup pubspec
        run: cp pubspec.yaml /tmp/pubspec.yaml

      - name: Recreate Flutter Android project
        run: flutter create --platforms=android .

      - name: Restore our pubspec
        run: cp /tmp/pubspec.yaml pubspec.yaml

      # 注入：
      #  1) 网络/悬浮窗/前台服务权限 + OverlayService，minSdk 提到 23
      #  2) <queries> 声明 pinduoduo 深链（Android 11+ 才能解析/打开）
      #  3) 自定义 Application：预创建悬浮窗引擎并注册全部插件，
      #     并额外提供 smzdm/open_url 原生通道（悬浮窗里直接拉起拼多多）
      - name: Patch AndroidManifest & minSdk & preload engine
        run: |
          python3 - <<'PY'
          import re, pathlib

          mf = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = mf.read_text(encoding='utf-8')

          perms = [
              'android.permission.INTERNET',
              'android.permission.SYSTEM_ALERT_WINDOW',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_SPECIAL_USE',
          ]
          for p in perms:
              if p not in s:
                  s = s.replace('</manifest>',
                                '    <uses-permission android:name="%s"/>\n</manifest>' % p)

          if 'OverlayService' not in s:
              service = (
                  '        <service\n'
                  '            android:name="flutter.overlay.window.flutter_overlay_window.OverlayService"\n'
                  '            android:exported="false"\n'
                  '            android:foregroundServiceType="specialUse">\n'
                  '            <property\n'
                  '                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"\n'
                  '                android:value="smzdm_number_overlay"/>\n'
                  '        </service>\n'
              )
              s = s.replace('</application>', service + '    </application>')

          # --- queries：允许解析并打开 pinduoduo:// 深链 ---
          if '<queries>' not in s:
              queries = (
                  '    <queries>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.VIEW"/>\n'
                  '            <data android:scheme="pinduoduo"/>\n'
                  '        </intent>\n'
                  '        <intent>\n'
                  '            <action android:name="android.intent.action.VIEW"/>\n'
                  '            <data android:scheme="https"/>\n'
                  '        </intent>\n'
                  '    </queries>\n'
              )
              s = s.replace('</manifest>', queries + '</manifest>')

          # --- 取包名，写入自定义 Application ---
          pkg = None
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              gp = pathlib.Path(f)
              if not gp.exists():
                  continue
              t = gp.read_text(encoding='utf-8')
              m = (re.search(r'namespace\s*[=]?\s*"([^"]+)"', t)
                   or re.search(r'applicationId\s*[=]?\s*"([^"]+)"', t))
              if m:
                  pkg = m.group(1)
                  break

          if pkg:
              if 'PreloadApp' not in s:
                  s = re.sub(r'<application(\s)',
                             '<application android:name="%s.PreloadApp"\\1' % pkg,
                             s, count=1)

              java = '''package %s;

          import android.app.Application;
          import android.content.Intent;
          import android.net.Uri;

          import io.flutter.FlutterInjector;
          import io.flutter.embedding.engine.FlutterEngine;
          import io.flutter.embedding.engine.FlutterEngineCache;
          import io.flutter.embedding.engine.FlutterEngineGroup;
          import io.flutter.embedding.engine.dart.DartExecutor;
          import io.flutter.plugin.common.MethodChannel;
          import io.flutter.plugins.GeneratedPluginRegistrant;

          /**
           * 预创建悬浮窗引擎并注册全部 Flutter 插件。
           * flutter_overlay_window 自建 overlay 引擎时不会注册插件，
           * 导致悬浮窗里无法使用 url_launcher / shared_preferences；
           * 这里提前用相同的缓存 tag 建好引擎（插件检测到已存在会直接复用），
           * 并额外注册 smzdm/open_url 原生通道用于拉起拼多多深链。
           */
          public class PreloadApp extends Application {
              private static final String TAG = "myCachedEngine";

              @Override
              public void onCreate() {
                  super.onCreate();
                  try {
                      if (FlutterEngineCache.getInstance().get(TAG) == null) {
                          FlutterEngineGroup group = new FlutterEngineGroup(this);
                          DartExecutor.DartEntrypoint entry = new DartExecutor.DartEntrypoint(
                                  FlutterInjector.instance().flutterLoader().findAppBundlePath(),
                                  "overlayMain");
                          FlutterEngine engine = group.createAndRunEngine(this, entry);
                          GeneratedPluginRegistrant.registerWith(engine);
                          registerOpenUrlChannel(engine);
                          FlutterEngineCache.getInstance().put(TAG, engine);
                      }
                  } catch (Throwable ignored) {
                      // 预创建失败不影响主流程
                  }
              }

              private void registerOpenUrlChannel(FlutterEngine engine) {
                  try {
                      MethodChannel channel = new MethodChannel(
                              engine.getDartExecutor().getBinaryMessenger(), "smzdm/open_url");
                      channel.setMethodCallHandler((call, result) -> {
                          if (!"open".equals(call.method)) {
                              result.notImplemented();
                              return;
                          }
                          try {
                              String url = call.argument("url");
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                              result.success(true);
                          } catch (Throwable t) {
                              result.success(false);
                          }
                      });
                  } catch (Throwable ignored) {
                  }
              }
          }
          ''' % pkg

              jp = pathlib.Path('android/app/src/main/java') / pkg.replace('.', '/') / 'PreloadApp.java'
              jp.parent.mkdir(parents=True, exist_ok=True)
              jp.write_text(java, encoding='utf-8')
              print('=== wrote %s ===' % jp)

          mf.write_text(s, encoding='utf-8')
          print('=== patched AndroidManifest.xml ===')
          print(s)

          # minSdk = 23（flutter_overlay_window 要求）
          for f in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              p = pathlib.Path(f)
              if p.exists():
                  t = p.read_text(encoding='utf-8')
                  t = t.replace('minSdk = flutter.minSdkVersion', 'minSdk = 23')
                  t = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 23', t)
                  t = re.sub(r'minSdk\s*=\s*\d+', 'minSdk = 23', t)
                  p.write_text(t, encoding='utf-8')
                  print('=== patched minSdk in %s ===' % f)
          PY

      - name: Install dependencies
        run: flutter pub get

      # 只输出静态分析结果（不阻断构建），便于失败时快速定位
      - name: Analyze
        run: flutter analyze || true

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smzdm-code-copy-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
